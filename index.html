<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>GeoReport</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 🔥 AQUI ESTÁ LA CLAVE -->
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/components.css" />

    <!-- Fuente bonita -->
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- 🔝 NAVBAR BONITO -->
    <header id="navbar">
      <div class="nav-brand">
        <div class="logo-circle">GR</div>
        <h1>GeoReport</h1>
      </div>

      <div id="connection-indicator" class="status-indicator online">
        <div class="status-dot"></div>
        <span>Online</span>
      </div>
    </header>

    <!-- 📦 CONTENEDOR -->
    <main id="app-container">
      <div class="app-header">
        <h2>Reportes</h2>
        <p class="subtitle">Registra incidencias con foto y ubicación</p>
      </div>

      <div id="reports-list"></div>
    </main>

    <!-- ➕ FAB -->
    <button id="fab-button">+</button>

    <!-- 🧾 MODAL BONITO -->
    <div id="report-modal" class="hidden">
      <div class="modal-content">
        <header>
          <div class="header-text">
            <h2>Nuevo Reporte</h2>
            <p>Captura evidencia y ubicación</p>
          </div>
          <button id="close-modal">×</button>
        </header>

        <form id="report-form">
          <div class="form-group">
            <label>Título</label>
            <input id="report-title" placeholder="Ej. Fuga de agua" required />
          </div>

          <div class="form-group">
            <label>Descripción</label>
            <textarea id="report-description"></textarea>
          </div>

          <!-- 📸 FOTO -->
          <div class="hardware-section">
            <button type="button" id="btn-camera" class="btn-secondary">
              📸 Tomar Foto
            </button>

            <div class="image-preview-container">
              <img
                id="preview"
                style="width: 100%; height: 100%; object-fit: cover"
              />
            </div>
          </div>

          <!-- 📍 UBICACIÓN -->
          <div class="form-group">
            <label>Ubicación</label>
            <input
              id="location-field"
              readonly
              placeholder="Obteniendo ubicación..."
            />
          </div>

          <!-- 💾 GUARDAR -->
          <button type="submit" class="btn-primary">Guardar Reporte</button>
        </form>
      </div>
    </div>

    <!-- 🔔 TOAST -->
    <div id="toast-container"></div>

    <!-- 🚀 JS -->
    <script type="module" src="js/app.js"></script>
  </body>
</html>
