<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoReport PWA - Sistema de Incidencias</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/components.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#2563eb">
</head>
<body>
    <nav id="navbar">
        <div class="nav-brand">
            <div class="logo-circle">GR</div>
            <h1>GeoReport</h1>
        </div>
        <div id="connection-status" class="status-indicator online">
            <span class="status-dot"></span>
            <span class="status-text">Online</span>
        </div>
    </nav>

    <main id="app-container">
        <header class="app-header">
            <h2>Mis Reportes</h2>
            <p class="subtitle">Gestiona las incidencias del campus UT</p>
        </header>
        
        <section id="reports-list-section">
            <div id="reports-list">
                <!-- Se poblará por js/modules/ui.js -->
                <div class="loading-placeholder">Cargando incidencias...</div>
            </div>
        </section>
    </main>

    <button id="fab-button" aria-label="Crear Reporte" title="Nuevo Reporte">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>

    <!-- Modal Form -->
    <div id="report-modal" class="hidden">
        <div class="modal-content">
            <header>
                <div class="header-text">
                    <h2>Nueva Incidencia</h2>
                    <p>Captura los detalles del problema</p>
                </div>
                <button id="close-modal" aria-label="Cerrar">&times;</button>
            </header>
            <form id="report-form">
                <div class="form-group">
                    <label for="report-title">Título</label>
                    <input type="text" id="report-title" placeholder="Ej. Lámpara fundida Edificio A" required minlength="5">
                </div>
                
                <div class="form-group">
                    <label for="report-description">Descripción</label>
                    <textarea id="report-description" rows="3" placeholder="Detalles de la ubicación o equipo dañado..."></textarea>
                </div>

                <div class="hardware-section">
                    <div class="image-preview-container">
                        <div id="camera-preview">
                            <span class="placeholder-icon">📸</span>
                            <p>Sin fotografía</p>
                        </div>
                    </div>
                    <button type="button" id="capture-pic" class="btn-secondary">
                        Tomar Foto
                    </button>
                </div>

                <div class="location-badge">
                    <span class="loc-icon">📍</span>
                    <span id="location-name">Esperando ubicación...</span>
                </div>

                <button type="submit" class="btn-primary" id="submit-btn">
                    Guardar Incidencia
                </button>
            </form>
        </div>
    </div>

    <!-- Toast Component -->
    <div id="toast-container"></div>

    <!-- Scripts -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
