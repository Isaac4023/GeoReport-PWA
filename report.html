<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuevo Reporte</title>

    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>

  <body>
    <header id="navbar">
      <h1>Nuevo Reporte</h1>
    </header>

    <div id="app-container">
      <form id="report-form">
        <div class="form-group">
          <label>Título</label>
          <input id="title" />
        </div>

        <div class="form-group">
          <label>Descripción</label>
          <textarea id="description"></textarea>
        </div>

        <div class="hardware-section">
          <!-- 🔥 VIDEO OCULTO (NECESARIO) -->
          <video id="camera" autoplay playsinline style="display: none"></video>

          <!-- 🔥 CANVAS OCULTO -->
          <canvas id="snapshot" hidden></canvas>

          <!-- PREVIEW BONITO -->
          <div class="image-preview-container">
            <img id="photo-preview" />
          </div>

          <button type="button" id="btn-take-photo" class="btn-secondary">
            📸 Tomar Foto
          </button>

          <p id="coords" class="location-badge">Obteniendo ubicación...</p>
        </div>

        <button type="button" id="btn-save-report" class="btn-primary">
          Guardar Reporte
        </button>
      </form>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
